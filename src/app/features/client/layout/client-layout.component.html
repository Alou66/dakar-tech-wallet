<div class="client-layout">
  <div class="sidebar-overlay" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-brand">
      <span class="brand-name">Dakar-Tech</span>
      <span class="brand-sub">Wallet</span>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeSidebar()"
        class="nav-link"
      >
        {{ item.label }}
      </a>
    </nav>
  </aside>

  <div class="main-wrapper">
    <header class="top-header">
      <button
        type="button"
        class="menu-toggle"
        (click)="toggleSidebar()"
        aria-label="Ouvrir le menu"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="header-right">
        <span class="user-name">{{ fullName }}</span>
        <button type="button" class="logout-btn" (click)="requestLogout()">Déconnexion</button>
      </div>
    </header>

    <main class="content-area">
      <router-outlet />
    </main>
  </div>

  <app-confirmation-modal
    [open]="showLogoutModal()"
    title="Confirmer la déconnexion"
    message="Voulez-vous vraiment vous déconnecter ?"
    confirmLabel="Se déconnecter"
    cancelLabel="Annuler"
    (confirm)="confirmLogout()"
    (cancel)="cancelLogout()"
  />
</div>
